<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SERVIX - Loja Digital</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>SERVIX</h1>
    <p>O teu mundo de internet</p>
</header>

<nav>
    <a href="#inicio">Início</a>
    <a href="#packages">Pacotes</a>
    <a href="#carrinho">Carrinho 🛒</a>
</nav>

<main id="inicio">

    <section class="boas-vindas">
        <h2>Internet ao melhor preço!</h2>
        <p>Escolhe os teus pacotes Vodacom.</p>
    </section>

    <input
        type="search"
        id="pesquisa"
        placeholder="Pesquisar pacotes..."
    >

    <div class="categorias">
        <button onclick="filtrar('todos')">Todos</button>
        <button onclick="filtrar('pequenos')">Pequenos</button>
        <button onclick="filtrar('medios')">Médios</button>
        <button onclick="filtrar('grandes')">Grandes</button>
    </div>

    <h2>Pacotes Vodacom</h2>

    <div id="packages"></div>

    <section id="carrinho">
        <h2>🛒 Meu carrinho</h2>

        <div id="itens-carrinho">
            Carrinho vazio.
        </div>

        <h3 id="total">Total: 0 MT</h3>

        <button onclick="finalizarCompra()">
            Finalizar compra
        </button>
    </section>

</main>

<footer>
    <h3>SERVIX</h3>
    <p>O teu mundo de internet.</p>
    <p>© 2026 SERVIX. Todos os direitos reservados.</p>
</footer>

<script src="script.js"></script>

</body>
</html>
